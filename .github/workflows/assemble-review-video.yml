name: Assemble verified review video
on:
  push:
    branches: [codex/review-video-parts-oct13]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/review-video-parts-oct13
      - name: Verify and commit exact recording
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          target=void-tarot/review/2026-10-13-18fe8c809a2a/complete.mp4
          mkdir -p "$(dirname "$target")"
          cat .review-video-parts/part-* > "$target"
          test "$(stat -c %s "$target")" = 90495550
          echo "18fe8c809a2a5f6bf3711f3356ce83ae2ab04bc1f836e7c28944df3c334531bd  $target" | sha256sum --check
          git rm -r .review-video-parts
          git add "$target"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble verified complete App Review recording'
          git push origin HEAD:codex/review-video-parts-oct13
